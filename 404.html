<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>404 - Halaman Tidak Ditemukan</title>
    <meta property="og:title" content="404 - Halaman Tidak Ditemukan">
    <meta property="og:description" content="Maaf, halaman yang Anda cari tidak dapat ditemukan.">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f8fafc;
        }
        
        /* Animasi Latar Belakang (Blobs) */
        .blob {
            position: absolute;
            filter: blur(60px);
            z-index: 0;
            opacity: 0.6;
            animation: float 10s infinite ease-in-out alternate;
        }
        .blob-1 {
            top: -10%; left: -10%;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(37,99,235,0.3) 0%, rgba(37,99,235,0) 70%);
            animation-delay: 0s;
        }
        .blob-2 {
            bottom: -20%; right: -10%;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(147,51,234,0.25) 0%, rgba(147,51,234,0) 70%);
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 50px) scale(1.1); }
        }

        /* Glassmorphism Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.05), 0 0 0 1px rgba(226, 232, 240, 0.5);
        }

        /* Loader Animation */
        .pulse-ring {
            position: absolute;
            width: 100%; height: 100%;
            border-radius: 50%;
            border: 3px solid #f43f5e; /* Rose color for error */
            animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
            opacity: 0.2;
        }
    </style>
</head>
<body class="relative min-h-screen flex items-center justify-center overflow-hidden selection:bg-rose-200 selection:text-rose-900">

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    
    <div class="absolute inset-0 z-0 opacity-[0.03]" style="background-image: radial-gradient(#000 1px, transparent 1px); background-size: 24px 24px;"></div>

    <main class="relative z-10 w-full max-w-lg px-6">
        <div class="glass-card rounded-[2rem] p-10 text-center flex flex-col items-center">
            
            <div class="relative flex items-center justify-center w-24 h-24 mb-8">
                <div class="pulse-ring"></div>
                <div class="absolute inset-0 bg-rose-100 rounded-full opacity-50"></div>
                <div class="relative z-10 bg-gradient-to-tr from-rose-500 to-red-600 text-white p-4 rounded-full shadow-lg shadow-rose-500/30 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                    </svg>
                </div>
            </div>

            <div class="inline-flex items-center gap-2 px-3 py-1 mb-4 rounded-full bg-rose-50 border border-rose-200">
                <span class="relative flex h-2 w-2">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-rose-500"></span>
                </span>
                <span class="text-[10px] font-black tracking-widest uppercase text-rose-700">Error 404</span>
            </div>
            
            <h1 class="text-3xl font-black text-slate-800 mb-3 tracking-tight">
                Halaman Tidak Ditemukan
            </h1>
            
            <p class="text-sm font-medium text-slate-500 leading-relaxed mb-8">
                Maaf, halaman yang Anda cari mungkin telah dipindahkan, dihapus, atau memang tidak pernah ada. Mari kembali ke jalan yang benar.
            </p>

            <a href="/" class="inline-flex items-center justify-center px-6 py-3 text-sm font-bold text-white transition-all bg-slate-800 rounded-full hover:bg-slate-900 hover:shadow-lg hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-slate-500 focus:ring-offset-2">
                Kembali ke Beranda
            </a>

        </div>

        <div class="text-center mt-8">
            <p class="text-xs font-semibold text-slate-400">
                &copy; 2026 Nama Perusahaan Anda
            </p>
        </div>
    </main>

</body>
</html>
