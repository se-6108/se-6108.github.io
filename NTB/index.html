<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnigmaStat | Under Maintenance</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
    
    <style>
        /* TEMA BIRU MATA ENGGANG (CYAN & SAPPHIRE) */
        :root {
            --bg-body: #f0f9ff;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #bae6fd;
            --primary: #0284c7; 
            --primary-hover: #0369a1;
            --warning: #d97706;
            --radius-lg: 16px;
            --radius-pill: 9999px;
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-body: #08121f; 
                --bg-card: #0f1c2e;
                --text-main: #f1f5f9;
                --text-muted: #94a3b8;
                --border-color: #1e3656;
                --primary: #0ea5e9; 
                --primary-hover: #38bdf8;
                --warning: #fbbf24;
                --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Montserrat', sans-serif; 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 20px;
        }
        
        .maintenance-card { 
            background: var(--bg-card); 
            border-radius: var(--radius-lg); 
            padding: 40px 30px; 
            max-width: 480px; 
            width: 100%;
            text-align: center; 
            border: 1px solid var(--border-color); 
            box-shadow: var(--shadow-md); 
        }

        .icon-container {
            width: 80px;
            height: 80px;
            background: rgba(2, 132, 199, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            color: var(--primary);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(2, 132, 199, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(2, 132, 199, 0); }
            100% { box-shadow: 0 0 0 0 rgba(2, 132, 199, 0); }
        }

        h1 { 
            font-size: 1.5rem; 
            font-weight: 700; 
            color: var(--text-main); 
            margin-bottom: 12px; 
            letter-spacing: -0.5px;
        }
        
        p { 
            font-size: 0.9rem; 
            color: var(--text-muted); 
            line-height: 1.6; 
            margin-bottom: 24px; 
            font-weight: 500;
        }

        .badge { 
            display: inline-flex; 
            align-items: center; 
            gap: 6px;
            background: rgba(217, 119, 6, 0.1); 
            color: var(--warning); 
            padding: 6px 16px; 
            border-radius: var(--radius-pill); 
            font-size: 0.75rem; 
            font-weight: 700; 
            border: 1px solid rgba(217, 119, 6, 0.2);
            margin-bottom: 24px;
        }

        .btn { 
            padding: 12px 24px; 
            border-radius: var(--radius-pill); 
            font-weight: 600; 
            font-size: 0.85rem; 
            cursor: pointer; 
            border: none; 
            font-family: inherit; 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px;
            background: var(--primary); 
            color: white;
            transition: 0.2s;
            width: 100%;
        }

        .btn:hover { 
            background: var(--primary-hover); 
            transform: translateY(-2px);
        }

        .icon { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .icon-sm { width: 16px; height: 16px; }
    </style>
</head>
<body>

    <div class="maintenance-card">
        <div class="icon-container">
            <svg class="icon" style="width: 40px; height: 40px;" viewBox="0 0 24 24">
                <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
            </svg>
        </div>
        
        <div class="badge">
            <svg class="icon icon-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            System Upgrade
        </div>

        <h1>EnigmaStat Sedang Diperbarui</h1>
        <p>Kami sedang melakukan kalibrasi algoritma <strong>Fasih Smart Parser</strong> dan <strong>Adjustment Matrix V10</strong> untuk memastikan perhitungan NTB Sensus Ekonomi 2026 semakin presisi dan aman dari anomali. Silakan kembali beberapa saat lagi.</p>
        
        <button class="btn" onclick="window.location.reload()">
            <svg class="icon icon-sm" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
            Muat Ulang Halaman
        </button>
    </div>

</body>
</html>
